<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>曾繁翔 · 个人简历</title>
<meta name="description" content="曾繁翔｜安徽理工大学智能车辆工程 2026 级。AIGC 全链路、Vibe Coding、无代码智能体、SolidWorks 建模。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0907">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0907'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23d4af37' stroke-width='2'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23e8c76a' font-family='serif'%3E曾%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0907;--bg2:#100e0a;--card:#14110c;--card2:#1a160f;
  --line:rgba(212,175,55,.2);--line2:rgba(212,175,55,.42);
  --text:#f0e8d4;--muted:#a69c86;--faint:#6f6756;
  --gold:#d4af37;--gold-hi:#f4dd94;--gold-lo:#9a7826;
  --grad:linear-gradient(135deg,#f7e7ae 0%,#e2c062 32%,#c49a32 62%,#8f6d1f 100%);
  --on-gold:#17120a;
  --glow:rgba(212,175,55,.16);
  --shadow:0 1px 0 rgba(255,236,180,.04) inset,0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-hi:0 1px 0 rgba(255,236,180,.06) inset,0 18px 40px -14px rgba(0,0,0,.85),0 0 0 1px rgba(212,175,55,.35);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;--nav-h:56px;--sub-h:44px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + var(--sub-h) + 12px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;font:15px/1.7 var(--sans);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(1000px 520px at 85% -8%,var(--glow),transparent 62%),
    radial-gradient(700px 420px at -10% 38%,var(--glow),transparent 60%),
    repeating-linear-gradient(135deg,transparent 0 22px,rgba(212,175,55,.022) 22px 23px);
  background-attachment:scroll;
  padding-bottom:env(safe-area-inset-bottom);
}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;z-index:99;background:var(--gold);color:var(--on-gold);padding:8px 14px;border-radius:8px}
.skip:focus{left:12px}
.gold-text{color:var(--gold-hi);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.print-only{display:none}

/* ===== 导航 ===== */
.nav{position:fixed;inset:0 0 auto;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.nav{background:var(--bg)}}
.nav-bar{display:flex;align-items:center;gap:10px;height:var(--nav-h)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1}
.mono{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  font:600 16px/1 var(--serif);color:var(--gold-hi);border:1px solid var(--line2);
  background:radial-gradient(circle at 30% 25%,rgba(244,221,148,.18),transparent 60%),var(--card)}
.brand b{font:600 17px/1.2 var(--serif);letter-spacing:.18em;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.tools{display:flex;gap:6px;flex:none}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--line);transition:border-color .2s var(--ease),background-color .2s var(--ease),transform .2s var(--ease)}
.ibtn:hover{border-color:var(--line2);background:var(--card)}
.ibtn:active{transform:scale(.96)}
.ibtn svg{width:20px;height:20px;stroke:var(--gold-hi);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.anchors{display:flex;gap:4px;height:var(--sub-h);align-items:center;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.anchors::-webkit-scrollbar{display:none}
.anchors a{flex:none;text-decoration:none;font-size:14px;color:var(--muted);padding:0 12px;height:36px;display:flex;align-items:center;
  border-radius:999px;border:1px solid transparent;transition:color .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease)}
.anchors a:hover{color:var(--text)}
.anchors a.on{color:var(--gold-hi);border-color:var(--line2);background:var(--card)}
@media (min-width:900px){
  :root{--sub-h:0px}
  html{scroll-padding-top:80px}
  .nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .nav-bar{display:contents}
  .brand{flex:0 0 auto}
  .anchors{order:1;margin-left:auto;height:auto;-webkit-mask-image:none;mask-image:none}
  .tools{order:2}
}

/* ===== Hero ===== */
.hero{position:relative;padding:calc(var(--nav-h) + var(--sub-h) + env(safe-area-inset-top) + 28px) 0 36px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%)}
.hero .wrap{position:relative;display:grid;gap:22px}
.hero-top{display:flex;gap:18px;align-items:center}
.portrait{position:relative;flex:none;width:104px;aspect-ratio:3/4}
.portrait::before{content:"";position:absolute;inset:-5px;border-radius:999px 999px 16px 16px;padding:1px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:999px 999px 12px 12px;background:var(--card2);
  filter:saturate(.92) contrast(1.02)}
.portrait .dot{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;
  background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center}
.portrait .dot::after{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--gold)}
.hero h1{font:600 clamp(40px,12vw,72px)/1.05 var(--serif);letter-spacing:.14em;margin:8px 0 6px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.6}
.summary{position:relative;padding:16px 16px 16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px}
.summary::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--grad)}
.summary b{color:var(--gold-hi);font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:3px 12px;border-radius:999px;font-size:13px;line-height:1.3;
  border:1px solid var(--line);background:var(--card);color:var(--text)}
.chip.g{border-color:var(--line2);color:var(--gold-hi);background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border-color:transparent}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:12px;cursor:pointer;
  text-decoration:none;font-size:15px;font-weight:500;letter-spacing:.04em;border:1px solid var(--line2);background:var(--card);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease),filter .2s var(--ease)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.btn:active{transform:translateY(0)}
.btn.primary{grid-column:1/-1;background:var(--grad);color:var(--on-gold);border-color:transparent;font-weight:600;
  box-shadow:0 8px 24px -10px rgba(212,175,55,.55)}
.btn.primary:hover{filter:brightness(1.06)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.facts div{padding:12px 8px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts b{display:block;font:600 20px/1.2 var(--serif)}
.facts span{font-size:12px;color:var(--muted)}
@media (min-width:760px){
  .hero{padding-top:110px;padding-bottom:56px}
  .hero .wrap{grid-template-columns:minmax(0,1fr) 220px;column-gap:48px;align-items:start}
  .hero-top{grid-column:1;display:block}
  .portrait{grid-column:2;grid-row:1/span 5;width:220px;margin-top:10px}
  .hero-top .portrait{display:none}
  .portrait.lg{display:block}
  .cta{grid-template-columns:auto auto auto;justify-content:start}
  .btn.primary{grid-column:auto}
  .hero .wrap>*:not(.portrait){grid-column:1}
}
.portrait.lg{display:none}
@media (min-width:760px){.portrait.lg{display:block}}

/* ===== 区块 ===== */
.sec{padding:40px 0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.sec-h .no{font:500 13px/1 var(--serif);color:var(--gold);letter-spacing:.1em;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;align-self:center}
.sec-h h2{font:600 24px/1.2 var(--serif);letter-spacing:.12em}
.sec-h .en{margin-left:auto;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:0 auto;max-width:1080px;padding:0 16px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold)}
@media (min-width:760px){.sec{padding:64px 0}.sec-h h2{font-size:30px}.sec-h{margin-bottom:28px}}

.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:transparent}}
.card.corner::before,.card.corner::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold);opacity:.75;pointer-events:none}
.card.corner::before{top:8px;left:8px;border-right:0;border-bottom:0}
.card.corner::after{bottom:8px;right:8px;border-left:0;border-top:0}

/* 亮点 */
.hl{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.hl .card{padding:18px 14px 16px}
.hl .card:first-child{grid-column:1/-1}
.hl .num{font:600 34px/1 var(--serif);letter-spacing:.02em;display:flex;align-items:baseline;gap:2px}
.hl .num small{font-size:16px}
.hl h3{font-size:14px;font-weight:600;margin:10px 0 6px;line-height:1.45}
.hl p{font-size:13px;color:var(--muted);line-height:1.6}
@media (min-width:760px){.hl{grid-template-columns:repeat(6,1fr);gap:16px}.hl .card{grid-column:span 2;padding:22px 20px}.hl .card:first-child,.hl .card:nth-child(2){grid-column:span 3}.hl .num{font-size:44px}}


/* 时间线 */
.tl{position:relative;display:grid;gap:16px;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--gold),var(--line) 70%,transparent)}
.tl-item{padding:18px 16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:24px;width:11px;height:11px;transform:rotate(45deg);background:var(--bg);border:1px solid var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl-item .head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.tl-item h3{font:600 17px/1.4 var(--serif);letter-spacing:.03em}
.date{font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.track{font-size:13.5px;color:var(--muted);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--text);line-height:1.5}
.tag.res{color:var(--on-gold);background:var(--grad);border-color:transparent;font-weight:600}
.star{display:grid;gap:10px}
.star li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;line-height:1.7}
.star b{font:600 12px/1 var(--sans);color:var(--gold);border:1px solid var(--line2);border-radius:5px;padding:5px 6px;height:max-content;margin-top:2px;letter-spacing:.06em}
.star li.r span{color:var(--text)}
.star li:not(.r) span{color:var(--muted)}
@media (min-width:760px){.tl{padding-left:30px}.tl-item{padding:22px 24px}.tl-item::before{left:-30px}}

/* 项目 */
.pj{display:grid;gap:14px}
.pj .card{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.pj .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pj h3{font:600 17px/1.45 var(--serif)}
.pj .badge{flex:none;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--gold-hi);white-space:nowrap}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack span{font-size:12px;padding:2px 9px;border-radius:5px;background:var(--glow);color:var(--text)}
.pj dl{margin:0;display:grid;gap:8px}
.pj dt{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.pj dd{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.7}
.pj dd.now{color:var(--text)}
.pj .link{margin-top:auto;align-self:flex-start;font-size:14px;color:var(--gold-hi);text-decoration:none;border-bottom:1px solid var(--line2);min-height:32px;display:inline-flex;align-items:center}
@media (min-width:760px){.pj{grid-template-columns:1fr 1fr;gap:18px}.pj .card{padding:22px 22px}}

/* 技能 */
.sk{display:grid;gap:12px}
.sk .card{padding:18px 16px}
.sk .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sk .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);flex:none;
  background:radial-gradient(circle at 30% 25%,rgba(244,221,148,.16),transparent 65%)}
.sk .ic svg{width:21px;height:21px;fill:none;stroke:var(--gold-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sk h3{font:600 16px/1.3 var(--serif);letter-spacing:.06em}
.sk h3 small{display:block;font:11px/1.4 var(--sans);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-top:3px}
.sk .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sk .chips .chip{min-height:28px;font-size:12.5px;padding:2px 10px}
.sk p{font-size:13.5px;color:var(--muted);line-height:1.7}
@media (min-width:640px){.sk{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.sk{grid-template-columns:repeat(3,1fr);gap:16px}.sk .card{padding:22px 20px}}

/* 教育 */
.edu{display:grid;gap:14px}
.edu .main{padding:20px 16px}
.edu h3{font:600 19px/1.4 var(--serif);letter-spacing:.04em}
.edu .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.edu .dept{color:var(--muted);font-size:14px;margin-top:4px}
.edu .major{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.edu .note{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.edu .note b{color:var(--gold);font-weight:600;margin-right:6px}
.hon{padding:18px 16px}
.hon h4{font:600 15px/1.3 var(--serif);letter-spacing:.12em;color:var(--gold-hi);margin-bottom:10px}
.hon li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.hon li:first-child{border-top:0}
.hon .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:var(--on-gold);font:600 13px/1 var(--serif)}
.hon strong{display:block;font-size:14.5px;font-weight:600}
.hon span{font-size:13px;color:var(--muted)}
@media (min-width:760px){.edu{grid-template-columns:1.4fr 1fr;gap:18px}.edu .main,.hon{padding:24px}}

/* 页脚 */
.motto{text-align:center;padding:40px 16px 8px}
.motto q{font:500 clamp(19px,5.4vw,28px)/1.6 var(--serif);letter-spacing:.14em;quotes:"「" "」"}
.motto small{display:block;margin-top:8px;font-size:11px;letter-spacing:.32em;color:var(--faint);text-transform:uppercase}
footer{padding:28px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:32px;color:var(--faint);font-size:12.5px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}

/* 返回顶部 & 提示 */
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:46px;height:46px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:20px;height:20px;fill:none;stroke:var(--gold-hi);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:var(--grad);color:var(--on-gold);font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);
  transition:opacity .2s var(--ease),transform .2s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 进入动画 */
.anim .reveal{opacity:0;transform:translateY(14px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.anim .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== 打印 ===== */
@media print{
  @page{size:A4;margin:12mm 12mm}
  :root{--bg:#fff;--bg2:#fff;--card:#fff;--card2:#fff;--text:#111;--muted:#444;--faint:#777;--line:#d9cba3;--line2:#b8994a;
    --gold:#7a5a14;--gold-hi:#7a5a14;--grad:linear-gradient(#7a5a14,#7a5a14);--on-gold:#fff;--glow:#f4ecd6;--shadow:none;--shadow-hi:none;color-scheme:light}
  body{background:#fff;font-size:10pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}

});

doc.getElementById("foot").append(el("span", {text:"© " + (R.updated||"").slice(0,4) + " " + R.name + " · 保留所有权利"}), el("span", {text:"最后更新：" + R.updated}));

/* ---------- 打印 / 返回顶部 ---------- */
var root = doc.documentElement;
doc.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
var totop = doc.getElementById("totop");
totop.addEventListener("click", function(){ window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); });
var ticking = false;
window.addEventListener("scroll", function(){ if (ticking) return; ticking = true;
  requestAnimationFrame(function(){ totop.classList.toggle("show", window.scrollY > 600); ticking = false; }); }, {passive:true});

/* ---------- 进入动画 + 导航高亮 ---------- */
if ("IntersectionObserver" in window){
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
    root.classList.add("anim");
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }); }, {rootMargin:"0px 0px -8% 0px"});
    doc.querySelectorAll(".reveal").forEach(function(r){ io.observe(r); });
  }
  var links = nav.querySelectorAll("a");
  var spy = new IntersectionObserver(function(es){ es.forEach(function(e){ if (!e.isIntersecting) return;
    links.forEach(function(a){ var on = a.getAttribute("data-id") === e.target.id; a.classList.toggle("on", on); if (on){ a.setAttribute("aria-current", "true");
      var L = nav.scrollLeft, r = a.offsetLeft - nav.offsetLeft; if (r < L || r + a.offsetWidth > L + nav.clientWidth) nav.scrollTo({left: r - 16, behavior:"smooth"}); } else a.removeAttribute("aria-current"); }); }); },
    {rootMargin:"-45% 0px -50% 0px"});
  doc.querySelectorAll("#top, .sec").forEach(function(s){ spy.observe(s); });
}
window.addEventListener("beforeprint", function(){ doc.querySelectorAll(".reveal").forEach(function(r){ r.classList.add("in"); }); });
})();
</script>
</body>
</html>
